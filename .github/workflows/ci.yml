name: Build & checks

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and production build
        run: npm run build

      - name: Service and render smoke checks
        run: npm run smoke

  # Phase 2 guard-rail: every privileged Firestore write must be denied.
  # Uses the Firebase Emulator Suite only — no project, no credentials, no
  # billing account, so it is safe to run on pull requests from forks.
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java (Firestore emulator runtime)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Firestore security rules tests
        shell: bash
        run: |
          set +e
          npm run test:rules 2>&1 | tee /tmp/rules.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The runner log is not always retrievable from every client, so
            # surface the first failures as check annotations too.
            awk '/Running script/{flag=1} flag' /tmp/rules.log \
              | sed -e 's/\x1b\[[0-9;]*m//g' \
              | head -n 14 \
              | while IFS= read -r line; do
                  [ -n "$line" ] && echo "::error::${line:0:900}"
                done
            exit "$status"
          fi
