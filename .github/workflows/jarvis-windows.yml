      - name: Diag - sig disk space
        if: always()
        shell: pwsh
        run: |
          $log = ""
          if (Test-Path "build-log.txt") { $log = Get-Content "build-log.txt" -Raw }
          if ($log -match "(?i)no space left") { Write-Host "matched"; exit 0 }
          Write-Host "not present"; exit 1

      - name: Diag - sig not enough space
