name: JARVIS Windows build

on:
  push:
    branches:
      - main
      - "arena/*"      # delivery build branches
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: jarvis-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A CI log commit is pushed to this branch so the log stays readable; those
  # pushes must not rebuild the app.
  # ---------------------------------------------------------------- tests ----
  test:
    name: Unit tests
    if: ${{ !startsWith(github.event.head_commit.message, 'ci-build-log') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core + test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 sounddevice numpy python-dotenv pytest

      - name: Install the Qt/GL runtime libraries
        # Without these PySide6 cannot import QtGui at all and the orb widget
        # test would silently skip instead of really exercising the paint path.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Run the test suite
        working-directory: JARVIS
        shell: bash
        run: |
          set -o pipefail
          # keep the full output as an artifact so a failure is debuggable even
          # when the run log itself cannot be downloaded
          python -m pytest tests -q 2>&1 | tee ../pytest-output.txt

      - name: Environment check
        working-directory: JARVIS
        run: python main.py --check

      - name: Diagnostics
        working-directory: JARVIS
        run: python main.py --diagnostics

  # ---------------------------------------------------------------- build ----
  build:
    name: Windows EXE (onedir)
    if: ${{ !startsWith(github.event.head_commit.message, 'ci-build-log') }}
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show the runner
        shell: pwsh
        run: |
          Write-Host "OS      : $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Arch     : $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          python -c "import sys; print('Python  :', sys.version); print('Exe     :', sys.executable)"

      # Each phase runs as its own step: the failed step's name says which
      # stage broke, which matters because the run log itself is not reachable.
      - name: Build phase 1 - Python version guard
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Python python -Phase preflight *>&1 |
              Tee-Object -FilePath ..\build-log.txt
          if ($LASTEXITCODE -ne 0) { throw "preflight failed with exit code $LASTEXITCODE" }

      - name: Diag - venv inside the repo folder
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          if (Test-Path ".venv") { Write-Host ".venv already exists" } else {
              python -m venv .venv
              if ($LASTEXITCODE -ne 0) { Write-Host "venv in repo failed"; exit 1 }
          }
          Write-Host "venv in repo ok"

      - name: Build phase 2 - create venv
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Python python -Phase setup *>&1 |
              Tee-Object -FilePath ..\build-log.txt
          if ($LASTEXITCODE -ne 0) { throw "setup phase failed with exit code $LASTEXITCODE" }

      - name: Build phase 3 - pip install requirements
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Python python -Phase install *>&1 |
              Tee-Object -FilePath ..\build-log.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "install phase failed with exit code $LASTEXITCODE" }

      - name: Tests - Actions
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest "tests/test_actions.py" -q *>&1 | Tee-Object -FilePath ..\test-output.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "tests/test_actions.py failed" }

      - name: Tests - Brain
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest "tests/test_brain.py" -q *>&1 | Tee-Object -FilePath ..\test-output.txt -Append
