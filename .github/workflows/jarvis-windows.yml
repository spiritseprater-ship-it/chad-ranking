          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Python python -Phase build *>&1 |
              Tee-Object -FilePath ..\build-log.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller phase failed with exit code $LASTEXITCODE" }

      - name: Diag - PyInstaller produced the exe
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          if (Test-Path "dist\JARVIS\JARVIS.exe") { Write-Host "JARVIS.exe present"; exit 0 }
