name: JARVIS Windows build

on:
  push:
    branches:
      - main
      - "arena/*"      # delivery build branches
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: jarvis-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A CI log commit is pushed to this branch so the log stays readable; those
  # pushes must not rebuild the app.
  # ---------------------------------------------------------------- tests ----
  test:
    name: Unit tests
    if: ${{ !startsWith(github.event.head_commit.message, 'ci-build-log') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core + test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 sounddevice numpy python-dotenv pytest

      - name: Install the Qt/GL runtime libraries
        # Without these PySide6 cannot import QtGui at all and the orb widget
        # test would silently skip instead of really exercising the paint path.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Run the test suite
        working-directory: JARVIS
        shell: bash
        run: |
          set -o pipefail
          # keep the full output as an artifact so a failure is debuggable even
          # when the run log itself cannot be downloaded
          python -m pytest tests -q 2>&1 | tee ../pytest-output.txt

      - name: Environment check
        working-directory: JARVIS
        run: python main.py --check

      - name: Diagnostics
        working-directory: JARVIS
        run: python main.py --diagnostics

  # ---------------------------------------------------------------- build ----
  build:
    name: Windows EXE (onedir)
    if: ${{ !startsWith(github.event.head_commit.message, 'ci-build-log') }}
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show the runner
        shell: pwsh
        run: |
          Write-Host "OS      : $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Arch     : $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          python -c "import sys; print('Python  :', sys.version); print('Exe     :', sys.executable)"

      # Each phase runs as its own step: the failed step's name says which
      # stage broke, which matters because the run log itself is not reachable.
      - name: Build phase 1 - Python version guard
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Python python -Phase preflight *>&1 |
              Tee-Object -FilePath ..\build-log.txt
          if ($LASTEXITCODE -ne 0) { throw "preflight failed with exit code $LASTEXITCODE" }

      - name: Diag - venv inside the repo folder
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          if (Test-Path ".venv") { Write-Host ".venv already exists" } else {
              python -m venv .venv
              if ($LASTEXITCODE -ne 0) { Write-Host "venv in repo failed"; exit 1 }
          }
          Write-Host "venv in repo ok"

      - name: Build phase 2 - create venv
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Python python -Phase setup *>&1 |
              Tee-Object -FilePath ..\build-log.txt
          if ($LASTEXITCODE -ne 0) { throw "setup phase failed with exit code $LASTEXITCODE" }

      - name: Build phase 3 - pip install requirements
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Python python -Phase install *>&1 |
              Tee-Object -FilePath ..\build-log.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "install phase failed with exit code $LASTEXITCODE" }

      - name: Tests - Actions
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest "tests/test_actions.py" -q *>&1 | Tee-Object -FilePath ..\test-output.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "tests/test_actions.py failed" }

      - name: Tests - Brain
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest "tests/test_brain.py" -q *>&1 | Tee-Object -FilePath ..\test-output.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "tests/test_brain.py failed" }

      - name: Tests - Browser
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest "tests/test_browser.py" -q *>&1 | Tee-Object -FilePath ..\test-output.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "tests/test_browser.py failed" }

      - name: Tests - Config and voice
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest "tests/test_config_and_voice.py" -q *>&1 | Tee-Object -FilePath ..\test-output.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "tests/test_config_and_voice.py failed" }

      - name: Tests - Desktop
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest "tests/test_desktop.py" -q *>&1 | Tee-Object -FilePath ..\test-output.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "tests/test_desktop.py failed" }

      - name: Tests - Gemini
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest "tests/test_gemini.py" -q *>&1 | Tee-Object -FilePath ..\test-output.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "tests/test_gemini.py failed" }

      - name: Tests - Integration
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest "tests/test_integration.py" -q *>&1 | Tee-Object -FilePath ..\test-output.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "tests/test_integration.py failed" }

      - name: Tests - Orb
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest "tests/test_orb.py" -q *>&1 | Tee-Object -FilePath ..\test-output.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "tests/test_orb.py failed" }

      - name: Tests - Paths
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest "tests/test_paths.py" -q *>&1 | Tee-Object -FilePath ..\test-output.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "tests/test_paths.py failed" }

      - name: Tests - Planner
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest "tests/test_planner.py" -q *>&1 | Tee-Object -FilePath ..\test-output.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "tests/test_planner.py failed" }

      - name: Tests - Router
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest "tests/test_router.py" -q *>&1 | Tee-Object -FilePath ..\test-output.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "tests/test_router.py failed" }

      - name: Build phase 5 - environment check
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Python python -Phase check *>&1 |
              Tee-Object -FilePath ..\build-log.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "check phase failed with exit code $LASTEXITCODE" }

      - name: Build phase 6 - PyInstaller
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Python python -Phase build *>&1 |
              Tee-Object -FilePath ..\build-log.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller phase failed with exit code $LASTEXITCODE" }

      - name: Diag - PyInstaller produced the exe
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          if (Test-Path "dist\JARVIS\JARVIS.exe") { Write-Host "JARVIS.exe present"; exit 0 }
          Write-Host "JARVIS.exe missing"; exit 1

      - name: Diag - PyInstaller produced the PYZ
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          if (Test-Path "build\JARVIS\PYZ-00.pyz") { Write-Host "PYZ present"; exit 0 }
          Write-Host "PYZ missing"; exit 1

      - name: Diag - PyInstaller produced the intermediate bootloader
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          if (Test-Path "build\JARVIS\JARVIS.exe") { Write-Host "bootloader present"; exit 0 }
          Write-Host "bootloader missing"; exit 1

      - name: Diag - PyInstaller produced the PKG
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          if (Test-Path "build\JARVIS\JARVIS.pkg") { Write-Host "PKG present"; exit 0 }
          Write-Host "PKG missing"; exit 1

      - name: Diag - variant [hiddenimports removed]
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          $src = Get-Content JARVIS.spec -Raw -Encoding UTF8
          $variant = $src -replace "(?s)hiddenimports=\[[^\]]*\]", "hiddenimports=[]"
          Set-Content -Path JARVIS-variant.spec -Value $variant -Encoding UTF8
          & .\.venv\Scripts\python.exe -m PyInstaller --noconfirm --clean --distpath dist-v --workpath build-v JARVIS-variant.spec *>&1 | Out-Null
          if (Test-Path "dist-v\JARVIS\JARVIS.exe") { Write-Host "variant built"; exit 0 }
          Write-Host "variant failed"; exit 1

      - name: Diag - variant [datas removed]
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          $src = Get-Content JARVIS.spec -Raw -Encoding UTF8
          $variant = $src -replace "(?s)datas=\[[^\]]*\]", "datas=[]"
          Set-Content -Path JARVIS-variant.spec -Value $variant -Encoding UTF8
          & .\.venv\Scripts\python.exe -m PyInstaller --noconfirm --clean --distpath dist-v --workpath build-v JARVIS-variant.spec *>&1 | Out-Null
          if (Test-Path "dist-v\JARVIS\JARVIS.exe") { Write-Host "variant built"; exit 0 }
          Write-Host "variant failed"; exit 1

      - name: Diag - variant [excludes removed]
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          $src = Get-Content JARVIS.spec -Raw -Encoding UTF8
          $variant = $src -replace "(?s)excludes=\[[^\]]*\]", "excludes=[]"
          Set-Content -Path JARVIS-variant.spec -Value $variant -Encoding UTF8
          & .\.venv\Scripts\python.exe -m PyInstaller --noconfirm --clean --distpath dist-v --workpath build-v JARVIS-variant.spec *>&1 | Out-Null
          if (Test-Path "dist-v\JARVIS\JARVIS.exe") { Write-Host "variant built"; exit 0 }
          Write-Host "variant failed"; exit 1

      - name: Diag - capture the build error lines
        if: always()
        shell: pwsh
        id: capture
        run: |
          $log = ""
          if (Test-Path "build-log.txt") { $log = Get-Content "build-log.txt" -Raw }
          $lines = @($log -split "`r?`n" | Where-Object { $_ -match "(?i)error|traceback|exception|failed" } | Select-Object -Last 8)
          for ($i = 1; $i -le 8; $i++) {
            if ($i -le $lines.Count) {
              $t = $lines[$i - 1].Trim() -replace "[^A-Za-z0-9]", "-"
              if ($t.Length -gt 130) { $t = $t.Substring(0, 130) }
            } else { $t = "none" }
            Add-Content -Path "$env:GITHUB_OUTPUT" -Value ("err{0}={1}" -f $i, $t)
          }
          Set-Content -Path diag-error.txt -Value ($lines -join "`n") -Encoding UTF8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-e1-${{ steps.capture.outputs.err1 }}
          path: diag-error.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-e2-${{ steps.capture.outputs.err2 }}
          path: diag-error.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-e3-${{ steps.capture.outputs.err3 }}
          path: diag-error.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-e4-${{ steps.capture.outputs.err4 }}
          path: diag-error.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-e5-${{ steps.capture.outputs.err5 }}
          path: diag-error.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-e6-${{ steps.capture.outputs.err6 }}
          path: diag-error.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-e7-${{ steps.capture.outputs.err7 }}
          path: diag-error.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-e8-${{ steps.capture.outputs.err8 }}
          path: diag-error.txt
          if-no-files-found: ignore


      - name: Build phase 7 - package the zip
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\build.ps1 -Python python -Phase package *>&1 |
              Tee-Object -FilePath ..\build-log.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "packaging phase failed with exit code $LASTEXITCODE" }

      - name: Verify the zip contents
        working-directory: JARVIS
        shell: pwsh
        run: |
          $zip = ".\JARVIS-Windows.zip"
          if (-not (Test-Path $zip)) { throw "JARVIS-Windows.zip was not produced" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
              $names = $archive.Entries | ForEach-Object { $_.FullName }
              Write-Host "Entries in $zip ($($names.Count)):"
              $names | Select-Object -First 12 | ForEach-Object { Write-Host "  $_" }
              Write-Host "  ... ($($names.Count - 12) more)"
              if (-not ($names -contains "JARVIS/JARVIS.exe")) {
                  throw "JARVIS.exe is missing from the zip"
              }
              foreach ($required in @("JARVIS/README.txt", "README.txt", "JARVIS/config.example.json", "JARVIS/uninstall.ps1", "JARVIS/.env.example")) {
                  if (-not ($names -contains $required)) { throw "Required entry missing from the zip: $required" }
              }
          } finally { $archive.Dispose() }

      - name: Smoke test the packaged executable
        working-directory: JARVIS
        shell: pwsh
        run: |
          # The onedir launcher has no console, so the exit code is the signal.
          $exe = ".\dist\JARVIS\JARVIS.exe"
          if (-not (Test-Path $exe)) { throw "dist\JARVIS\JARVIS.exe not found" }
          $proc = Start-Process -FilePath $exe -ArgumentList "--check" -PassThru -WindowStyle Hidden
          if (-not $proc.WaitForExit(180000)) {
              $proc.Kill(); throw "The packaged executable did not exit within 3 minutes"
          }
          Write-Host "Packaged --check exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "The packaged executable failed its smoke test" }

      - name: Build report
        working-directory: JARVIS
        shell: pwsh
        run: |
          $exe   = (Get-Item ".\dist\JARVIS\JARVIS.exe").Length
          $dir   = (Get-ChildItem ".\dist\JARVIS" -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $zip   = (Get-Item ".\JARVIS-Windows.zip").Length
          $py    = (& python -c "import sys; print(sys.version)") -join ""
          $pi    = (& python -c "import PyInstaller; print(PyInstaller.__version__)") -join ""
          $arch  = (& python -c "import platform; print(platform.machine(), platform.system())") -join ""
          $lines = @(
              "JARVIS Windows build report",
              "Generated : $([DateTime]::UtcNow.ToString('o'))",
              "Runner     : windows-latest ($env:RUNNER_OS)",
              "Architecture: $arch",
              "Python     : $py",
              "PyInstaller: $pi",
              "",
              "Sizes",
              ("  JARVIS.exe            {0:N2} MB ({1:N0} bytes)" -f ($exe / 1MB), $exe),
              ("  runtime folder (onedir) {0:N2} MB ({1:N0} bytes)" -f ($dir / 1MB), $dir),
              ("  JARVIS-Windows.zip     {0:N2} MB ({1:N0} bytes)" -f ($zip / 1MB), $zip),
              "",
              "Checksums",
              (Get-FileHash ".\JARVIS-Windows.zip" -Algorithm SHA256 | Select-Object -ExpandProperty Hash),
              "  JARVIS-Windows.zip",
              (Get-FileHash ".\dist\JARVIS\JARVIS.exe" -Algorithm SHA256 | Select-Object -ExpandProperty Hash),
              "  JARVIS.exe",
              "",
              "Note: onedir mode - JARVIS.exe needs the JARVIS folder next to it.",
              "The full test suite ran inside build.ps1 and passed before packaging."
          )
          $lines | Set-Content -Path "..\build-report.txt" -Encoding UTF8
          $lines | ForEach-Object { Write-Host $_ }

      - name: Prepare artifacts
        working-directory: JARVIS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "..\artifacts" -Force | Out-Null
          Copy-Item ".\JARVIS-Windows.zip" "..\artifacts\JARVIS-Windows.zip" -Force
          Copy-Item ".\dist\JARVIS\JARVIS.exe" "..\artifacts\JARVIS.exe" -Force
          Copy-Item "..\build-report.txt" "..\artifacts\build-report.txt" -Force
          Copy-Item ".\SHA256SUMS.txt" "..\artifacts\SHA256SUMS.txt" -Force

      - name: Publish the build log (stage)
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          $log = "..\build-log.txt"
          if (-not (Test-Path $log)) { Write-Host "No build log to publish"; exit 0 }
          Write-Host "Build log exists: $((Get-Item $log).Length) bytes"
          git config user.email "ci@users.noreply.github.com"
          git config user.name "JARVIS CI"
          git add -f -A
          git status --short

      - name: Publish the build log (commit)
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          $hash = (Get-FileHash "..\build-log.txt" -Algorithm SHA256).Hash
          if (git diff --cached --quiet) {
              Write-Host "Nothing staged - the log is already committed"
          } else {
              git commit -q -m "ci-build-log $hash"
          }
          git log --oneline -1

      - name: Publish the build log (push)
        if: always()
        working-directory: JARVIS
        shell: pwsh
        run: |
          git push origin "refs/heads/arena/cc541324-chad-ranking"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: Upload the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-pytest-output
          path: pytest-output.txt
          if-no-files-found: ignore

      - name: Upload JARVIS-Windows.zip
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-zip
          path: artifacts/JARVIS-Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload JARVIS.exe
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-exe
          path: artifacts/JARVIS.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-build-report
          path: artifacts/build-report.txt
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------- release ----
  release:
    name: GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/') && !startsWith(github.event.head_commit.message, 'ci-build-log') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --target "$GITHUB_SHA" \
            --title "JARVIS $GITHUB_REF_NAME" \
            --notes-file release/build-report.txt \
            release/JARVIS-Windows.zip release/JARVIS.exe
